<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Your FairSwap Sign-in Code</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #111827; margin: 0; padding: 24px;">
  <div style="max-width: 560px; margin: 0 auto; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 32px;">
    <h1 style="color: #047857; font-size: 24px; margin-top: 0;">FairSwap.in</h1>
    <h2 style="font-size: 18px; color: #111827;">Your verification code</h2>
    <p>Use the following 6-digit code to sign in to your FairSwap account:</p>
    <div style="margin: 24px 0; text-align: center;">
      <span id="otp-token" data-testid="otp-token" style="display: inline-block; font-size: 32px; font-weight: 700; letter-spacing: 6px; color: #047857; background: #f0fdf4; border: 1px solid #bbf7d0; padding: 12px 24px; border-radius: 8px;">
        {{ .Token }}
      </span>
    </div>
    <p style="color: #6b7280; font-size: 14px;">This code will expire in 60 minutes. If you did not request this code, you can safely ignore this email.</p>
  </div>
</body>
</html>
