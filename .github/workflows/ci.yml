name: CI Test & Validation

on:
  pull_request:
    branches:
      - main
      - staging
      - pr/**
      - feature/**
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  test-and-validate:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Mint short-lived Backend Contents-read token
        id: backend-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # pinned v2
        with:
          app-id: ${{ vars.FAIRSWAP_BACKEND_CI_APP_ID }}
          private-key: ${{ secrets.FAIRSWAP_BACKEND_CI_APP_PRIVATE_KEY }}
          owner: vivek2310sharma
          repositories: FairSwap-Backend
          permission-contents: read

      - name: Checkout immutable private Backend source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4.2.2
        with:
          repository: vivek2310sharma/FairSwap-Backend
          ref: b3d7eae6cb3eaeaf4fc2f4c2a4d288b69aa62367
          token: ${{ steps.backend-token.outputs.token }}
          path: .fairswap-backend-ci-source
          persist-credentials: false

      - name: Validate and materialize Backend SQL only for disposable CI
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/materialize-backend.mjs "$GITHUB_WORKSPACE/.fairswap-backend-ci-source"
          rm -rf -- "$GITHUB_WORKSPACE/.fairswap-backend-ci-source"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate active documentation and retired milestone gates
        run: pnpm docs:check

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run SRCH-01 Listing Card Unit Tests
        run: pnpm vitest run src/__tests__/listing-card.test.tsx

      - name: Run SRCH-04 Search Filters and Locality Pagination Unit Tests
        run: pnpm vitest run src/__tests__/search-filters-and-chips.test.tsx src/__tests__/locality-page.test.ts

      - name: Install Playwright Chromium for SRCH-01
        run: pnpm exec playwright install chromium

      - name: Build Application for SRCH-01 E2E
        run: pnpm run build

      - name: Run SRCH-01 Isolated Mobile Search E2E
        run: pnpm exec playwright test --config=playwright.srch-01.config.ts

      - name: Run LIST-03 WhatsApp Sharing Unit Tests
        run: pnpm vitest run tests/unit/share.test.tsx

      - name: Run ADS-08 My Listings Regression Unit Tests
        run: pnpm vitest run tests/unit/action-matrix.test.ts tests/unit/listing-actions-container.test.tsx tests/unit/post-ad-journey-dashboard.test.tsx src/__tests__/my-listings-revision.test.tsx

      - name: Run Auth Email Template Contract Tests
        run: |
          pnpm vitest run tests/unit/auth-email-templates.test.ts tests/unit/sign-in-actions.test.ts tests/auth/callback.test.ts tests/unit/extract-otp.test.ts
          node --test tools/sync-supabase-auth-emails.test.mjs tools/sync-supabase-recovery-email.test.mjs

      - name: Run New Post Ad & Saved Edit Regression Tests
        run: pnpm vitest run tests/unit/post-ad-goods-entry.test.tsx tests/unit/post-ad-goods-page.test.tsx tests/unit/post-ad-goods-server.test.ts tests/unit/post-ad-goods-edit-retention.test.tsx

      - name: Run S1 Test-Only Non-Delivery Capture Unit Tests
        run: |
          test -f tests/unit/email-outbox-s1-capture.test.ts
          pnpm vitest run tests/unit/email-outbox-s1-capture.test.ts

      - name: Run Moderation Unit Tests
        run: |
          if compgen -G "src/__tests__/moderation-*.test.ts*" > /dev/null; then
            pnpm vitest run src/__tests__/moderation-*.test.ts*
          else
            echo "No moderation unit tests found on this branch; skipping."
          fi

  database-security-tests:
    name: Supabase Local DB & Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Mint short-lived Backend Contents-read token
        id: backend-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # pinned v2
        with:
          app-id: ${{ vars.FAIRSWAP_BACKEND_CI_APP_ID }}
          private-key: ${{ secrets.FAIRSWAP_BACKEND_CI_APP_PRIVATE_KEY }}
          owner: vivek2310sharma
          repositories: FairSwap-Backend
          permission-contents: read

      - name: Checkout immutable private Backend source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4.2.2
        with:
          repository: vivek2310sharma/FairSwap-Backend
          ref: b3d7eae6cb3eaeaf4fc2f4c2a4d288b69aa62367
          token: ${{ steps.backend-token.outputs.token }}
          path: .fairswap-backend-ci-source
          persist-credentials: false

      - name: Validate and materialize Backend SQL only for disposable CI
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/materialize-backend.mjs "$GITHUB_WORKSPACE/.fairswap-backend-ci-source"
          rm -rf -- "$GITHUB_WORKSPACE/.fairswap-backend-ci-source"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Disposable Local Supabase
        run: |
          supabase stop || true
          supabase start -x studio,analytics,logflare,supavisor

      - name: Run Schema & Media Invalidation pgTAP Tests
        run: |
          # Required baseline pgTAP test suite (fail-closed if any expected file is missing)
          REQUIRED_FILES=(
            "supabase/tests/admin_medium_operation.test.sql"
            "supabase/tests/admin_reviewed_contract.test.sql"
            "supabase/tests/schema_listings.test.sql"
            "supabase/tests/schema_security.test.sql"
          )
          for req in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$req" ]; then
              echo "::error::Required baseline pgTAP test file '$req' is missing. Aborting."
              exit 1
            fi
          done

          # Automatically discover all valid pgTAP test files (including future migrations like MOD-02B)
          # Note: schema_email_outbox.test.sql remains explicitly documented as excluded/unverified due to obsolete pre-existing pgTAP syntax
          TEST_FILES=()
          for f in supabase/tests/*.test.sql; do
            if [ -f "$f" ] && [ "$(basename "$f")" != "schema_email_outbox.test.sql" ]; then
              TEST_FILES+=("$f")
            fi
          done

          echo "Running pgTAP test files (${#TEST_FILES[@]} found): ${TEST_FILES[*]}"
          supabase test db "${TEST_FILES[@]}"

      - name: Run RLS & Database Security Tests
        env:
          CI: "true"
          REQUIRE_DB_TESTS: "true"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
        run: |
          # Fail-closed enforcement: required security test file must exist
          if [ ! -f "tests/security/listings-rls.test.ts" ]; then
            echo "::error::Required security test file tests/security/listings-rls.test.ts not found. Aborting."
            exit 1
          fi
          pnpm vitest run tests/security/listings-rls.test.ts

      - name: Run MOD-03A Automatic Moderation Integration Tests
        run: |
          # Detect whether MOD-03A migrations and features are present on this branch
          MIGRATION_38="supabase/migrations/20261011000038_create_moderation_queue_and_results.sql"
          MIGRATION_39="supabase/migrations/20261011000039_moderation_dispatch_and_killswitch.sql"
          INTEGRATION_TEST="src/__tests__/moderation-integration.test.ts"

          if [ -f "$MIGRATION_38" ] || [ -f "$MIGRATION_39" ]; then
            echo "MOD-03A migrations detected. Requiring integration test suite $INTEGRATION_TEST..."
            if [ ! -f "$INTEGRATION_TEST" ]; then
              echo "::error::MOD-03A migrations are present but required integration test $INTEGRATION_TEST is missing. Aborting."
              exit 1
            fi

            # Parse dynamic connection configuration from local Supabase CLI
            STATUS_JSON=$(supabase status -o json)
            DB_URL=$(echo "$STATUS_JSON" | jq -r '.DB_URL // empty')
            REST_URL=$(echo "$STATUS_JSON" | jq -r '.API_URL // empty')
            ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')
            SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // empty')

            if [ -z "$DB_URL" ] || [ -z "$REST_URL" ]; then
              echo "::error::Failed to read local Supabase connection configuration from status output."
              exit 1
            fi

            # Extract host and port safely
            DB_PORT=$(echo "$DB_URL" | sed -n 's/.*:\([0-9]*\)\/.*/\1/p')
            DB_HOST="127.0.0.1"

            # Generate unique test run identity for this CI run
            TASK_RUN_ID="ci-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
            echo "Initializing test run identity: $TASK_RUN_ID on port $DB_PORT"

            # Create disposable validation marker strictly in local PostgreSQL
            supabase db query 'CREATE SCHEMA IF NOT EXISTS test_validation_meta;'
            supabase db query 'CREATE TABLE IF NOT EXISTS test_validation_meta.run_identity (run_id text PRIMARY KEY, task text NOT NULL);'
            supabase db query "INSERT INTO test_validation_meta.run_identity (run_id, task) VALUES ('$TASK_RUN_ID', 'MOD-03A') ON CONFLICT (run_id) DO UPDATE SET task = EXCLUDED.task;"

            # Execute all MOD-03A integration tests with opt-in enabled and capture machine-readable JSON results
            REPORT_FILE="mod03a-integration-report.json"
            MOD03A_RUN_LOCAL_DB_TESTS=true \
            MOD03A_TASK_RUN_ID="$TASK_RUN_ID" \
            MOD03A_DB_HOST="$DB_HOST" \
            MOD03A_DB_PORT="$DB_PORT" \
            MOD03A_DB_NAME="postgres" \
            NEXT_PUBLIC_SUPABASE_URL="$REST_URL" \
            NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
            SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            pnpm vitest run "$INTEGRATION_TEST" --pool=threads --reporter=default --reporter=json --outputFile="$REPORT_FILE"

            # Machine-readable Zero-Skip Enforcement
            if [ ! -f "$REPORT_FILE" ]; then
              echo "::error::Integration test report '$REPORT_FILE' was not generated. Aborting."
              exit 1
            fi

            TOTAL=$(jq -r '.numTotalTests // empty' "$REPORT_FILE")
            PASSED=$(jq -r '.numPassedTests // empty' "$REPORT_FILE")
            FAILED=$(jq -r '.numFailedTests // empty' "$REPORT_FILE")
            PENDING=$(jq -r '.numPendingTests // empty' "$REPORT_FILE")
            TODO=$(jq -r '.numTodoTests // empty' "$REPORT_FILE")
            SUCCESS=$(jq -r '.success // empty' "$REPORT_FILE")

            echo "=== MOD-03A Integration Test Result Audit ==="
            echo "Total: $TOTAL | Passed: $PASSED | Failed: $FAILED | Skipped/Pending: $PENDING | Todo: $TODO | Success: $SUCCESS"

            if [ "$SUCCESS" != "true" ]; then
              echo "::error::Vitest reported suite failure (success: $SUCCESS)."
              exit 1
            fi

            if [ "$TOTAL" -lt 13 ]; then
              echo "::error::Expected at least 13 integration tests to execute (Safety + Cases A through L), but found only $TOTAL."
              exit 1
            fi

            if [ "$FAILED" -ne 0 ]; then
              echo "::error::One or more integration tests failed ($FAILED failed)."
              exit 1
            fi

            if [ "$PENDING" -ne 0 ] || [ "$TODO" -ne 0 ]; then
              echo "::error::Zero-skip policy violated! Detected skipped/pending: $PENDING, todo: $TODO. All required integration scenarios must execute."
              exit 1
            fi

            echo "✓ Zero-skip verification PASSED: All $PASSED required MOD-03A scenarios executed and passed with 0 skips."
          else
            echo "MOD-03A migrations not detected on this branch; skipping MOD-03A integration suite."
          fi

      - name: Run S1 Disposable Direct Auth & Family Compatibility SQL
        env:
          CI: "true"
          POST_AD_RUN_LOCAL_DB_TESTS: "true"
          POST_AD_DB_HOST: "127.0.0.1"
          POST_AD_DB_PORT: "54322"
          POST_AD_DB_RUN_ID: "post-ad-disposable-${{ github.run_id }}-${{ github.run_attempt }}"
        run: |
          set -euo pipefail
          # This step is disposable LOCAL contract evidence, not hosted Test S1.
          [[ "${GITHUB_ACTIONS:-}" == "true" ]] || { echo "::error::GitHub Actions isolation required"; exit 1; }
          [[ "$POST_AD_DB_RUN_ID" =~ ^post-ad-disposable-[0-9]+-[0-9]+$ ]] || exit 1
          DB_URL=$(supabase status -o json | jq -r '.DB_URL // empty')
          # Never print DB_URL: it contains the local container password.
          [[ "$DB_URL" =~ ^postgres(ql)?://postgres:[^@]+@127\.0\.0\.1:54322/postgres$ ]] || {
            echo "::error::Only the positively identified local 127.0.0.1:54322/postgres stack is allowed"
            exit 1
          }
          [[ -f tests/security/post-ad-compatibility-disposable-db.test.ts &&
             -f tests/security/sql/post-ad-current-base-compatibility.sql ]] || exit 1
          # supabase test db provisions pgTAP in its own runner/session; the
          # independent node-postgres connection needs the extension installed.
          # This DDL is strictly inside the disposable local Supabase DB.
          supabase db query "CREATE EXTENSION IF NOT EXISTS pgtap WITH SCHEMA extensions;"
          supabase db query "CREATE SCHEMA IF NOT EXISTS test_validation_meta;"
          supabase db query "CREATE TABLE IF NOT EXISTS test_validation_meta.run_identity (run_id text PRIMARY KEY, task text NOT NULL);"
          supabase db query "INSERT INTO test_validation_meta.run_identity (run_id,task) VALUES ('$POST_AD_DB_RUN_ID','POST-AD-DISPOSABLE-DB-VERIFY-01') ON CONFLICT (run_id) DO UPDATE SET task=excluded.task;"
          pnpm vitest run tests/security/post-ad-compatibility-disposable-db.test.ts

  pg17-release-rehearsal:
    name: Isolated PostgreSQL 17 Release Rehearsal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Mint short-lived Backend Contents-read token
        id: backend-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # pinned v2
        with:
          app-id: ${{ vars.FAIRSWAP_BACKEND_CI_APP_ID }}
          private-key: ${{ secrets.FAIRSWAP_BACKEND_CI_APP_PRIVATE_KEY }}
          owner: vivek2310sharma
          repositories: FairSwap-Backend
          permission-contents: read

      - name: Checkout immutable private Backend source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4.2.2
        with:
          repository: vivek2310sharma/FairSwap-Backend
          ref: b3d7eae6cb3eaeaf4fc2f4c2a4d288b69aa62367
          token: ${{ steps.backend-token.outputs.token }}
          path: .fairswap-backend-ci-source
          persist-credentials: false

      - name: Validate and materialize Backend SQL only for disposable CI
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/materialize-backend.mjs "$GITHUB_WORKSPACE/.fairswap-backend-ci-source"
          rm -rf -- "$GITHUB_WORKSPACE/.fairswap-backend-ci-source"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Phase 1 — Verify Supabase CLI & Pinned Image PG17 Compatibility
        run: |
          echo "=== Phase 1: Checking PostgreSQL 17 compatibility on disposable runner ==="
          # Create isolated temporary staging directory for PG17 test stack without touching permanent repo config
          mkdir -p /tmp/sb-pg17-rehearsal/supabase/migrations
          mkdir -p /tmp/sb-pg17-rehearsal/supabase/tests

          # Copy config.toml and override major_version = 17 in isolated directory
          sed 's/major_version = 15/major_version = 17/' supabase/config.toml > /tmp/sb-pg17-rehearsal/supabase/config.toml
          cp -r supabase/templates /tmp/sb-pg17-rehearsal/supabase/ || true

          echo "Starting isolated Supabase stack with major_version = 17 in /tmp/sb-pg17-rehearsal..."
          cd /tmp/sb-pg17-rehearsal
          supabase start -x studio,analytics,logflare,supavisor

          # Query actual server version
          PG_VERSION=$(supabase db query "SHOW server_version;" --output json | jq -r '.[0].server_version // empty')
          PG_NUM=$(supabase db query "SHOW server_version_num;" --output json | jq -r '.[0].server_version_num // empty')
          echo "Actual PostgreSQL server version reported: $PG_VERSION (numeric: $PG_NUM)"

          # Check if major version is 17
          if [[ "$PG_VERSION" =~ ^17\. ]]; then
            echo "✓ Phase 1 PASSED: Supabase CLI successfully started PostgreSQL 17 stack ($PG_VERSION)."
          else
            echo "::error::PostgreSQL 17 was requested but stack reported version '$PG_VERSION'. Aborting."
            supabase stop
            exit 1
          fi

      - name: Phase 2 — Reconstruct Production Baseline (Exact 36 Migrations)
        run: |
          echo "=== Phase 2: Reconstructing FairSwapProd 36-migration baseline ==="
          cd /tmp/sb-pg17-rehearsal

          # Define the exact 36 production baseline migrations (ordered)
          BASELINE_MIGRATIONS=(
            "20260914000001_create_accounts_and_profiles.sql"
            "20260914000002_create_staff_and_security.sql"
            "20260914000003_create_audit_and_privacy.sql"
            "20260914000004_create_categories_and_locations.sql"
            "20260914000005_create_listings.sql"
            "20260914000006_create_listing_media.sql"
            "20260914000007_create_storage_buckets_and_policies.sql"
            "20260914000008_create_listing_rpcs.sql"
            "20260914000009_create_discovery_and_favourites.sql"
            "20260914000010_create_notifications.sql"
            "20260914000011_create_communication.sql"
            "20260914000012_create_abuse_controls_and_reports.sql"
            "20260914000013_create_support_and_appeals.sql"
            "20260914000014_create_privacy_fulfillment_and_fk_safety.sql"
            "20260914000015_correct_report_notification_and_permissions.sql"
            "20260914000016_staff_user_moderation_and_hardening.sql"
            "20260914000017_fix_report_target_visibility.sql"
            "20260916000018_performance_and_reliability_indexes.sql"
            "20260916000019_fix_public_rls_staff_helper_execution.sql"
            "20260918000020_legal_acceptance_and_age_audit.sql"
            "20260918000021_policy_reacceptance_records.sql"
            "20260926000022_listing_email_notifications.sql"
            "20260926000023_email_outbox_dispatch_runtime.sql"
            "20260926000024_email_outbox_runtime_extensions.sql"
            "20260929000025_india_postal_location_schema.sql"
            "20260930000026_fix_india_location_admin_and_lookup.sql"
            "20260930000027_support_multi_district_pincodes.sql"
            "20260930000028_harden_official_postal_snapshot.sql"
            "20261001000029_fix_listing_landmark_column_permissions.sql"
            "20261001000030_require_explicit_postal_source.sql"
            "20261001000031_harden_public_listing_location_privacy.sql"
            "20261001000032_add_staff_private_listing_location_access.sql"
            "20261002000033_seller_media_management.sql"
            "20261007153735_admin_pending_medium_download.sql"
            "20261007153744_atomic_reviewed_moderation.sql"
            "20261007161425_admin_pending_medium_download_info.sql"
          )

          echo "Staging ${#BASELINE_MIGRATIONS[@]} baseline migrations in isolated environment..."
          for mig in "${BASELINE_MIGRATIONS[@]}"; do
            cp "$GITHUB_WORKSPACE/supabase/migrations/$mig" supabase/migrations/
          done

          echo "Applying baseline migrations with 'supabase migration up'..."
          START_MS=$(date +%s%3N)
          supabase migration up
          END_MS=$(date +%s%3N)
          DURATION=$((END_MS - START_MS))
          echo "Baseline migrations applied via CLI in ${DURATION}ms"

          echo "Auditing migration tracking table and verifying exact baseline versions..."
          APPLIED_JSON=$(supabase db query "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version ASC;" --output json)
          echo "schema_migrations records in local PostgreSQL 17:"
          echo "$APPLIED_JSON"

          RECORDED_COUNT=$(echo "$APPLIED_JSON" | jq 'length')
          echo "Recorded migration count: $RECORDED_COUNT"

          if [ "$RECORDED_COUNT" -ne 36 ]; then
            echo "::error::Expected exactly 36 recorded migrations in baseline, but found $RECORDED_COUNT."
            exit 1
          fi

          # Verify exact version list matching BASELINE_MIGRATIONS
          for mig in "${BASELINE_MIGRATIONS[@]}"; do
            VER=$(echo "$mig" | cut -d'_' -f1)
            MATCH=$(echo "$APPLIED_JSON" | jq -r --arg v "$VER" '.[] | select(.version == $v) | .version')
            if [ -z "$MATCH" ]; then
              echo "::error::Baseline migration version $VER missing from migration tracking!"
              exit 1
            fi
          done
          echo "✓ All 36 baseline migration versions verified in migration history with zero discrepancies."

          echo "Auditing extensions and core tables in PG17 baseline..."
          supabase db query "SELECT extname, extversion FROM pg_extension WHERE extname IN ('pgcrypto', 'uuid-ossp', 'pg_net', 'pg_cron', 'vault');"
          supabase db query "SELECT count(*) AS total_public_tables FROM information_schema.tables WHERE table_schema = 'public';"
          echo "✓ Phase 2 PASSED: 36-migration production baseline established."

      - name: Phase 3 — Rehearse MOD-02B Security Migrations & Regression Tests
        run: |
          echo "=== Phase 3: Applying and testing MOD-02B security migrations ==="
          cd /tmp/sb-pg17-rehearsal

          MOD02B_MIGRATIONS=(
            "20261010071050_invalidate_pending_review_on_media_mutation.sql"
            "20261010080000_remediate_legacy_moderate_listing.sql"
            "20261010090000_invalidate_resubmission_review_token.sql"
          )

          echo "Staging ${#MOD02B_MIGRATIONS[@]} MOD-02B migrations in isolated environment..."
          for mig in "${MOD02B_MIGRATIONS[@]}"; do
            cp "$GITHUB_WORKSPACE/supabase/migrations/$mig" supabase/migrations/
          done

          echo "Applying MOD-02B migrations with 'supabase migration up'..."
          START_MS=$(date +%s%3N)
          supabase migration up
          END_MS=$(date +%s%3N)
          DURATION=$((END_MS - START_MS))
          echo "MOD-02B migrations applied via CLI in ${DURATION}ms"

          echo "Auditing migration tracking table for exact 39 migrations..."
          APPLIED_JSON=$(supabase db query "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version ASC;" --output json)
          echo "schema_migrations records after MOD-02B:"
          echo "$APPLIED_JSON"

          RECORDED_COUNT=$(echo "$APPLIED_JSON" | jq 'length')
          echo "Recorded migration count after MOD-02B: $RECORDED_COUNT"

          if [ "$RECORDED_COUNT" -ne 39 ]; then
            echo "::error::Expected exactly 39 recorded migrations after MOD-02B, but found $RECORDED_COUNT."
            exit 1
          fi

          for mig in "${MOD02B_MIGRATIONS[@]}"; do
            VER=$(echo "$mig" | cut -d'_' -f1)
            MATCH=$(echo "$APPLIED_JSON" | jq -r --arg v "$VER" '.[] | select(.version == $v) | .version')
            if [ -z "$MATCH" ]; then
              echo "::error::MOD-02B migration version $VER missing from migration tracking!"
              exit 1
            fi
          done
          echo "✓ All 39 migration versions (36 baseline + 3 MOD-02B) verified in migration history with zero discrepancies."

          echo "Running pgTAP tests against PG17 with MOD-02B..."
          cp "$GITHUB_WORKSPACE/supabase/tests/pending_review_media_invalidation.test.sql" /tmp/sb-pg17-rehearsal/supabase/tests/
          cp "$GITHUB_WORKSPACE/supabase/tests/admin_reviewed_contract.test.sql" /tmp/sb-pg17-rehearsal/supabase/tests/
          cp "$GITHUB_WORKSPACE/supabase/tests/admin_medium_operation.test.sql" /tmp/sb-pg17-rehearsal/supabase/tests/
          cp "$GITHUB_WORKSPACE/supabase/tests/schema_listings.test.sql" /tmp/sb-pg17-rehearsal/supabase/tests/
          cp "$GITHUB_WORKSPACE/supabase/tests/schema_security.test.sql" /tmp/sb-pg17-rehearsal/supabase/tests/

          supabase test db \
            /tmp/sb-pg17-rehearsal/supabase/tests/pending_review_media_invalidation.test.sql \
            /tmp/sb-pg17-rehearsal/supabase/tests/admin_reviewed_contract.test.sql \
            /tmp/sb-pg17-rehearsal/supabase/tests/admin_medium_operation.test.sql \
            /tmp/sb-pg17-rehearsal/supabase/tests/schema_listings.test.sql \
            /tmp/sb-pg17-rehearsal/supabase/tests/schema_security.test.sql

          # Run RLS security test suite against PG17 stack
          STATUS_JSON=$(supabase status -o json)
          REST_URL=$(echo "$STATUS_JSON" | jq -r '.API_URL // empty')
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')
          SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // empty')

          cd "$GITHUB_WORKSPACE"
          CI=true \
          REQUIRE_DB_TESTS=true \
          NEXT_PUBLIC_SUPABASE_URL="$REST_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          pnpm vitest run tests/security/listings-rls.test.ts

          echo "✓ Phase 3 PASSED: MOD-02B security migrations and regression tests verified on PG17."

      - name: Phase 4 — Rehearse Dormant MOD-03A Separately
        run: |
          echo "=== Phase 4: Applying and testing dormant MOD-03A migrations ==="
          cd /tmp/sb-pg17-rehearsal

          MOD03A_MIGRATIONS=(
            "20261011000038_create_moderation_queue_and_results.sql"
            "20261011000039_moderation_dispatch_and_killswitch.sql"
          )

          echo "Staging ${#MOD03A_MIGRATIONS[@]} MOD-03A migrations in isolated environment..."
          for mig in "${MOD03A_MIGRATIONS[@]}"; do
            cp "$GITHUB_WORKSPACE/supabase/migrations/$mig" supabase/migrations/
          done

          echo "Applying MOD-03A migrations with 'supabase migration up'..."
          START_MS=$(date +%s%3N)
          supabase migration up
          END_MS=$(date +%s%3N)
          DURATION=$((END_MS - START_MS))
          echo "MOD-03A migrations applied via CLI in ${DURATION}ms"

          echo "Auditing migration tracking table for exact 41 migrations..."
          APPLIED_JSON=$(supabase db query "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version ASC;" --output json)
          echo "schema_migrations records after MOD-03A:"
          echo "$APPLIED_JSON"

          RECORDED_COUNT=$(echo "$APPLIED_JSON" | jq 'length')
          echo "Recorded migration count after MOD-03A: $RECORDED_COUNT"

          if [ "$RECORDED_COUNT" -ne 41 ]; then
            echo "::error::Expected exactly 41 recorded migrations after MOD-03A, but found $RECORDED_COUNT."
            exit 1
          fi

          for mig in "${MOD03A_MIGRATIONS[@]}"; do
            VER=$(echo "$mig" | cut -d'_' -f1)
            MATCH=$(echo "$APPLIED_JSON" | jq -r --arg v "$VER" '.[] | select(.version == $v) | .version')
            if [ -z "$MATCH" ]; then
              echo "::error::MOD-03A migration version $VER missing from migration tracking!"
              exit 1
            fi
          done
          echo "✓ All 41 migration versions (36 baseline + 3 MOD-02B + 2 MOD-03A) verified in migration history with zero discrepancies."

          # Verify automation is disabled by default
          SETTING_VAL=$(supabase db query "SELECT setting_value FROM public.app_system_settings WHERE setting_key = 'moderation_automation_enabled';" --output json | jq -r '.[0].setting_value // empty')
          echo "DB setting moderation_automation_enabled: '$SETTING_VAL'"
          if [ "$SETTING_VAL" != "false" ]; then
            echo "::error::Expected moderation_automation_enabled to default to 'false', but found '$SETTING_VAL'."
            exit 1
          fi

          # Connection setup for integration test
          STATUS_JSON=$(supabase status -o json)
          DB_URL=$(echo "$STATUS_JSON" | jq -r '.DB_URL // empty')
          REST_URL=$(echo "$STATUS_JSON" | jq -r '.API_URL // empty')
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')
          SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // empty')
          DB_PORT=$(echo "$DB_URL" | sed -n 's/.*:\([0-9]*\)\/.*/\1/p')

          TASK_RUN_ID="ci-pg17-rehearsal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
          supabase db query 'CREATE SCHEMA IF NOT EXISTS test_validation_meta;'
          supabase db query 'CREATE TABLE IF NOT EXISTS test_validation_meta.run_identity (run_id text PRIMARY KEY, task text NOT NULL);'
          supabase db query "INSERT INTO test_validation_meta.run_identity (run_id, task) VALUES ('$TASK_RUN_ID', 'MOD-03A') ON CONFLICT (run_id) DO UPDATE SET task = EXCLUDED.task;"

          cd "$GITHUB_WORKSPACE"
          REPORT_FILE="mod03a-pg17-report.json"
          MOD03A_RUN_LOCAL_DB_TESTS=true \
          MOD03A_TASK_RUN_ID="$TASK_RUN_ID" \
          MOD03A_DB_HOST="127.0.0.1" \
          MOD03A_DB_PORT="$DB_PORT" \
          MOD03A_DB_NAME="postgres" \
          NEXT_PUBLIC_SUPABASE_URL="$REST_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          pnpm vitest run src/__tests__/moderation-integration.test.ts --pool=threads --reporter=default --reporter=json --outputFile="$REPORT_FILE"

          # Zero-skip audit
          TOTAL=$(jq -r '.numTotalTests // empty' "$REPORT_FILE")
          PASSED=$(jq -r '.numPassedTests // empty' "$REPORT_FILE")
          FAILED=$(jq -r '.numFailedTests // empty' "$REPORT_FILE")
          PENDING=$(jq -r '.numPendingTests // empty' "$REPORT_FILE")
          SUCCESS=$(jq -r '.success // empty' "$REPORT_FILE")

          echo "=== MOD-03A PG17 Rehearsal Audit ==="
          echo "Total: $TOTAL | Passed: $PASSED | Failed: $FAILED | Skipped: $PENDING | Success: $SUCCESS"

          if [ "$SUCCESS" != "true" ] || [ "$FAILED" -ne 0 ] || [ "$PENDING" -ne 0 ] || [ "$TOTAL" -lt 13 ]; then
            echo "::error::MOD-03A zero-skip verification failed on PG17!"
            exit 1
          fi

          echo "✓ Phase 4 PASSED: MOD-03A rehearsal verified with 13/13 scenarios passing on PostgreSQL 17."

      - name: Phase 5 — Teardown Isolated PG17 Rehearsal Stack
        if: always()
        run: |
          echo "Tearing down isolated PG17 Supabase stack..."
          cd /tmp/sb-pg17-rehearsal && supabase stop || true
          rm -rf /tmp/sb-pg17-rehearsal

  post-ad-insert-guard-pg17:
    name: Post Ad INSERT RLS Production Baseline (PostgreSQL 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Setup Node.js for private Backend snapshot guard
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Mint short-lived Backend Contents-read token
        id: backend-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # pinned v2
        with:
          app-id: ${{ vars.FAIRSWAP_BACKEND_CI_APP_ID }}
          private-key: ${{ secrets.FAIRSWAP_BACKEND_CI_APP_PRIVATE_KEY }}
          owner: vivek2310sharma
          repositories: FairSwap-Backend
          permission-contents: read

      - name: Checkout immutable private Backend source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4.2.2
        with:
          repository: vivek2310sharma/FairSwap-Backend
          ref: b3d7eae6cb3eaeaf4fc2f4c2a4d288b69aa62367
          token: ${{ steps.backend-token.outputs.token }}
          path: .fairswap-backend-ci-source
          persist-credentials: false

      - name: Validate and materialize Backend SQL only for disposable CI
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/materialize-backend.mjs "$GITHUB_WORKSPACE/.fairswap-backend-ci-source"
          rm -rf -- "$GITHUB_WORKSPACE/.fairswap-backend-ci-source"

      - name: Start disposable PostgreSQL 17 stack
        run: |
          set -euo pipefail
          mkdir -p /tmp/fairswap-issue133/supabase/migrations /tmp/fairswap-issue133/supabase/tests
          sed 's/major_version = 15/major_version = 17/' supabase/config.toml > /tmp/fairswap-issue133/supabase/config.toml
          cp -r supabase/templates /tmp/fairswap-issue133/supabase/
          grep -q 'major_version = 17' /tmp/fairswap-issue133/supabase/config.toml
          cd /tmp/fairswap-issue133
          supabase start -x studio,analytics,logflare,supavisor
          VERSION=$(supabase db query 'SHOW server_version;' --output json | jq -r '.[0].server_version // empty')
          [[ "$VERSION" == 17.* ]] || { echo "::error::PostgreSQL 17 required, found $VERSION"; exit 1; }

      - name: Reconstruct exact Production 36 migration baseline
        run: |
          set -euo pipefail
          for file in "$GITHUB_WORKSPACE"/supabase/migrations/*.sql; do
            name=$(basename "$file")
            version=$(echo "$name" | cut -d '_' -f1)
            if [[ "$version" < '20261007161426' ]]; then
              cp "$file" /tmp/fairswap-issue133/supabase/migrations/
            fi
          done
          FILES=$(find /tmp/fairswap-issue133/supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          [[ "$FILES" -eq 36 ]] || { echo "::error::Expected 36 baseline files, found $FILES"; exit 1; }
          cd /tmp/fairswap-issue133
          supabase migration up
          RECORDED=$(supabase db query 'SELECT count(*)::int AS total FROM supabase_migrations.schema_migrations;' --output json | jq -r '.[0].total')
          [[ "$RECORDED" -eq 36 ]] || { echo "::error::Expected 36 baseline versions, found $RECORDED"; exit 1; }

      - name: Rehearse Goods 38 to 39 INSERT RLS guard
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261008210921_post_ad_category_metadata.sql" /tmp/fairswap-issue133/supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261009163210_seller_listing_category_context.sql" /tmp/fairswap-issue133/supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261013192336_post_ad_listing_insert_category_guard.sql" /tmp/fairswap-issue133/supabase/migrations/
          cp "$GITHUB_WORKSPACE/supabase/tests/listings_insert_category_eligibility.test.sql" /tmp/fairswap-issue133/supabase/tests/
          cd /tmp/fairswap-issue133
          supabase migration up
          RECORDED=$(supabase db query 'SELECT count(*)::int AS total FROM supabase_migrations.schema_migrations;' --output json | jq -r '.[0].total')
          [[ "$RECORDED" -eq 39 ]] || { echo "::error::Expected Goods-only 39 migration versions, found $RECORDED"; exit 1; }
          supabase test db /tmp/fairswap-issue133/supabase/tests/listings_insert_category_eligibility.test.sql

      - name: Teardown isolated PostgreSQL 17 stack
        if: always()
        run: |
          cd /tmp/fairswap-issue133 && supabase stop || true
          rm -rf /tmp/fairswap-issue133
