            "20261007153744_atomic_reviewed_moderation.sql"
            "20261007161425_admin_pending_medium_download_info.sql"
          )

          echo "Staging ${#BASELINE_MIGRATIONS[@]} baseline migrations in isolated environment..."
          for mig in "${BASELINE_MIGRATIONS[@]}"; do
            cp "$GITHUB_WORKSPACE/supabase/migrations/$mig" supabase/migrations/
          done

          echo "Applying baseline migrations with 'supabase migration up'..."
          START_MS=$(date +%s%3N)
          supabase migration up
          END_MS=$(date +%s%3N)
          DURATION=$((END_MS - START_MS))
          echo "Baseline migrations applied via CLI in ${DURATION}ms"

          echo "Auditing migration tracking table and verifying exact baseline versions..."
          APPLIED_JSON=$(supabase db query "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version ASC;" --output json)
          echo "schema_migrations records in local PostgreSQL 17:"
          echo "$APPLIED_JSON"

          RECORDED_COUNT=$(echo "$APPLIED_JSON" | jq 'length')
          echo "Recorded migration count: $RECORDED_COUNT"

          if [ "$RECORDED_COUNT" -ne 36 ]; then
            echo "::error::Expected exactly 36 recorded migrations in baseline, but found $RECORDED_COUNT."
            exit 1
          fi

          # Verify exact version list matching BASELINE_MIGRATIONS
          for mig in "${BASELINE_MIGRATIONS[@]}"; do
            VER=$(echo "$mig" | cut -d'_' -f1)
            MATCH=$(echo "$APPLIED_JSON" | jq -r --arg v "$VER" '.[] | select(.version == $v) | .version')
            if [ -z "$MATCH" ]; then
              echo "::error::Baseline migration version $VER missing from migration tracking!"
              exit 1
            fi
          done
          echo "✓ All 36 baseline migration versions verified in migration history with zero discrepancies."

          echo "Auditing extensions and core tables in PG17 baseline..."
          supabase db query "SELECT extname, extversion FROM pg_extension WHERE extname IN ('pgcrypto', 'uuid-ossp', 'pg_net', 'pg_cron', 'vault');"
          supabase db query "SELECT count(*) AS total_public_tables FROM information_schema.tables WHERE table_schema = 'public';"
          echo "✓ Phase 2 PASSED: 36-migration production baseline established."

      - name: Phase 3 — Rehearse MOD-02B Security Migrations & Regression Tests
        run: |
          echo "=== Phase 3: Applying and testing MOD-02B security migrations ==="
          cd /tmp/sb-pg17-rehearsal

          MOD02B_MIGRATIONS=(
            "20261010071050_invalidate_pending_review_on_media_mutation.sql"
            "20261010080000_remediate_legacy_moderate_listing.sql"
            "20261010090000_invalidate_resubmission_review_token.sql"
          )

          echo "Staging ${#MOD02B_MIGRATIONS[@]} MOD-02B migrations in isolated environment..."
          for mig in "${MOD02B_MIGRATIONS[@]}"; do
            cp "$GITHUB_WORKSPACE/supabase/migrations/$mig" supabase/migrations/
          done

          echo "Applying MOD-02B migrations with 'supabase migration up'..."
          START_MS=$(date +%s%3N)
          supabase migration up
          END_MS=$(date +%s%3N)
          DURATION=$((END_MS - START_MS))
          echo "MOD-02B migrations applied via CLI in ${DURATION}ms"

          echo "Auditing migration tracking table for exact 39 migrations..."
          APPLIED_JSON=$(supabase db query "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version ASC;" --output json)
          echo "schema_migrations records after MOD-02B:"
          echo "$APPLIED_JSON"

          RECORDED_COUNT=$(echo "$APPLIED_JSON" | jq 'length')
          echo "Recorded migration count after MOD-02B: $RECORDED_COUNT"

          if [ "$RECORDED_COUNT" -ne 39 ]; then
            echo "::error::Expected exactly 39 recorded migrations after MOD-02B, but found $RECORDED_COUNT."
            exit 1
          fi

          for mig in "${MOD02B_MIGRATIONS[@]}"; do
            VER=$(echo "$mig" | cut -d'_' -f1)
            MATCH=$(echo "$APPLIED_JSON" | jq -r --arg v "$VER" '.[] | select(.version == $v) | .version')
            if [ -z "$MATCH" ]; then
              echo "::error::MOD-02B migration version $VER missing from migration tracking!"
              exit 1
            fi
          done
          echo "✓ All 39 migration versions (36 baseline + 3 MOD-02B) verified in migration history with zero discrepancies."

          echo "Running pgTAP tests against PG17 with MOD-02B..."
          cp "$GITHUB_WORKSPACE/supabase/tests/pending_review_media_invalidation.test.sql" /tmp/sb-pg17-rehearsal/supabase/tests/
          cp "$GITHUB_WORKSPACE/supabase/tests/admin_reviewed_contract.test.sql" /tmp/sb-pg17-rehearsal/supabase/tests/
          cp "$GITHUB_WORKSPACE/supabase/tests/admin_medium_operation.test.sql" /tmp/sb-pg17-rehearsal/supabase/tests/
          cp "$GITHUB_WORKSPACE/supabase/tests/schema_listings.test.sql" /tmp/sb-pg17-rehearsal/supabase/tests/
          cp "$GITHUB_WORKSPACE/supabase/tests/schema_security.test.sql" /tmp/sb-pg17-rehearsal/supabase/tests/

          supabase test db \
            /tmp/sb-pg17-rehearsal/supabase/tests/pending_review_media_invalidation.test.sql \
            /tmp/sb-pg17-rehearsal/supabase/tests/admin_reviewed_contract.test.sql \
            /tmp/sb-pg17-rehearsal/supabase/tests/admin_medium_operation.test.sql \
            /tmp/sb-pg17-rehearsal/supabase/tests/schema_listings.test.sql \
            /tmp/sb-pg17-rehearsal/supabase/tests/schema_security.test.sql

          # Run RLS security test suite against PG17 stack
          STATUS_JSON=$(supabase status -o json)
          REST_URL=$(echo "$STATUS_JSON" | jq -r '.API_URL // empty')
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')
          SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // empty')

          cd "$GITHUB_WORKSPACE"
          CI=true \
          REQUIRE_DB_TESTS=true \
          NEXT_PUBLIC_SUPABASE_URL="$REST_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          pnpm vitest run tests/security/listings-rls.test.ts

          echo "✓ Phase 3 PASSED: MOD-02B security migrations and regression tests verified on PG17."

      - name: Phase 4 — Rehearse Dormant MOD-03A Separately
        run: |
          echo "=== Phase 4: Applying and testing dormant MOD-03A migrations ==="
          cd /tmp/sb-pg17-rehearsal

          MOD03A_MIGRATIONS=(
            "20261011000038_create_moderation_queue_and_results.sql"
            "20261011000039_moderation_dispatch_and_killswitch.sql"
          )

          echo "Staging ${#MOD03A_MIGRATIONS[@]} MOD-03A migrations in isolated environment..."
          for mig in "${MOD03A_MIGRATIONS[@]}"; do
            cp "$GITHUB_WORKSPACE/supabase/migrations/$mig" supabase/migrations/
          done

          echo "Applying MOD-03A migrations with 'supabase migration up'..."
          START_MS=$(date +%s%3N)
          supabase migration up
          END_MS=$(date +%s%3N)
          DURATION=$((END_MS - START_MS))
          echo "MOD-03A migrations applied via CLI in ${DURATION}ms"

          echo "Auditing migration tracking table for exact 41 migrations..."
          APPLIED_JSON=$(supabase db query "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version ASC;" --output json)
          echo "schema_migrations records after MOD-03A:"
          echo "$APPLIED_JSON"

          RECORDED_COUNT=$(echo "$APPLIED_JSON" | jq 'length')
          echo "Recorded migration count after MOD-03A: $RECORDED_COUNT"

          if [ "$RECORDED_COUNT" -ne 41 ]; then
            echo "::error::Expected exactly 41 recorded migrations after MOD-03A, but found $RECORDED_COUNT."
            exit 1
          fi

          for mig in "${MOD03A_MIGRATIONS[@]}"; do
            VER=$(echo "$mig" | cut -d'_' -f1)
            MATCH=$(echo "$APPLIED_JSON" | jq -r --arg v "$VER" '.[] | select(.version == $v) | .version')
            if [ -z "$MATCH" ]; then
              echo "::error::MOD-03A migration version $VER missing from migration tracking!"
              exit 1
            fi
          done
          echo "✓ All 41 migration versions (36 baseline + 3 MOD-02B + 2 MOD-03A) verified in migration history with zero discrepancies."

          # Verify automation is disabled by default
          SETTING_VAL=$(supabase db query "SELECT setting_value FROM public.app_system_settings WHERE setting_key = 'moderation_automation_enabled';" --output json | jq -r '.[0].setting_value // empty')
          echo "DB setting moderation_automation_enabled: '$SETTING_VAL'"
          if [ "$SETTING_VAL" != "false" ]; then
            echo "::error::Expected moderation_automation_enabled to default to 'false', but found '$SETTING_VAL'."
            exit 1
          fi

          # Connection setup for integration test
          STATUS_JSON=$(supabase status -o json)
          DB_URL=$(echo "$STATUS_JSON" | jq -r '.DB_URL // empty')
          REST_URL=$(echo "$STATUS_JSON" | jq -r '.API_URL // empty')
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')
          SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // empty')
          DB_PORT=$(echo "$DB_URL" | sed -n 's/.*:\([0-9]*\)\/.*/\1/p')

          TASK_RUN_ID="ci-pg17-rehearsal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
          supabase db query 'CREATE SCHEMA IF NOT EXISTS test_validation_meta;'
          supabase db query 'CREATE TABLE IF NOT EXISTS test_validation_meta.run_identity (run_id text PRIMARY KEY, task text NOT NULL);'
          supabase db query "INSERT INTO test_validation_meta.run_identity (run_id, task) VALUES ('$TASK_RUN_ID', 'MOD-03A') ON CONFLICT (run_id) DO UPDATE SET task = EXCLUDED.task;"

          cd "$GITHUB_WORKSPACE"
          REPORT_FILE="mod03a-pg17-report.json"
          MOD03A_RUN_LOCAL_DB_TESTS=true \
          MOD03A_TASK_RUN_ID="$TASK_RUN_ID" \
          MOD03A_DB_HOST="127.0.0.1" \
          MOD03A_DB_PORT="$DB_PORT" \
          MOD03A_DB_NAME="postgres" \
          NEXT_PUBLIC_SUPABASE_URL="$REST_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          pnpm vitest run src/__tests__/moderation-integration.test.ts --pool=threads --reporter=default --reporter=json --outputFile="$REPORT_FILE"

          # Zero-skip audit
          TOTAL=$(jq -r '.numTotalTests // empty' "$REPORT_FILE")
          PASSED=$(jq -r '.numPassedTests // empty' "$REPORT_FILE")
          FAILED=$(jq -r '.numFailedTests // empty' "$REPORT_FILE")
          PENDING=$(jq -r '.numPendingTests // empty' "$REPORT_FILE")
          SUCCESS=$(jq -r '.success // empty' "$REPORT_FILE")

          echo "=== MOD-03A PG17 Rehearsal Audit ==="
          echo "Total: $TOTAL | Passed: $PASSED | Failed: $FAILED | Skipped: $PENDING | Success: $SUCCESS"

          if [ "$SUCCESS" != "true" ] || [ "$FAILED" -ne 0 ] || [ "$PENDING" -ne 0 ] || [ "$TOTAL" -lt 13 ]; then
            echo "::error::MOD-03A zero-skip verification failed on PG17!"
            exit 1
          fi

          echo "✓ Phase 4 PASSED: MOD-03A rehearsal verified with 13/13 scenarios passing on PostgreSQL 17."

      - name: Phase 5 — Teardown Isolated PG17 Rehearsal Stack
        if: always()
        run: |
          echo "Tearing down isolated PG17 Supabase stack..."
          cd /tmp/sb-pg17-rehearsal && supabase stop || true
          rm -rf /tmp/sb-pg17-rehearsal
