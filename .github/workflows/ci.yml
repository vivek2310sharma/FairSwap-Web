name: CI Test & Validation

on:
  pull_request:
    branches:
      - staging
      - pr/**
      - feature/**
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  test-and-validate:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Unit Tests
        run: |
          if compgen -G "src/__tests__/moderation-*.test.ts" > /dev/null; then
            pnpm vitest run src/__tests__/moderation-*.test.ts
          else
            echo "No moderation unit tests found on this branch; skipping."
          fi
