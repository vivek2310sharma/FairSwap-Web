name: CI Test & Validation

on:
  pull_request:
    branches:
      - staging
      - pr/**
      - feature/**
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  test-and-validate:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Moderation Unit Tests
        run: |
          if compgen -G "src/__tests__/moderation-*.test.ts" > /dev/null; then
            pnpm vitest run src/__tests__/moderation-*.test.ts
          else
            echo "No moderation unit tests found on this branch; skipping."
          fi

  database-security-tests:
    name: Supabase Local DB & Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Disposable Local Supabase
        run: supabase start -x studio,analytics,logflare,supavisor

      - name: Run Schema & Media Invalidation pgTAP Tests
        run: |
          # Required baseline pgTAP test suite (fail-closed if any expected file is missing)
          REQUIRED_FILES=(
            "supabase/tests/admin_medium_operation.test.sql"
            "supabase/tests/admin_reviewed_contract.test.sql"
            "supabase/tests/schema_listings.test.sql"
            "supabase/tests/schema_security.test.sql"
          )
          for req in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$req" ]; then
              echo "::error::Required baseline pgTAP test file '$req' is missing. Aborting."
              exit 1
            fi
          done

          # Automatically discover all valid pgTAP test files (including future migrations like MOD-02B)
          # Note: schema_email_outbox.test.sql remains explicitly documented as excluded/unverified due to obsolete pre-existing pgTAP syntax
          TEST_FILES=()
          for f in supabase/tests/*.test.sql; do
            if [ -f "$f" ] && [ "$(basename "$f")" != "schema_email_outbox.test.sql" ]; then
              TEST_FILES+=("$f")
            fi
          done

          echo "Running pgTAP test files (${#TEST_FILES[@]} found): ${TEST_FILES[*]}"
          supabase test db "${TEST_FILES[@]}"

      - name: Run RLS & Database Security Tests
        env:
          CI: "true"
          REQUIRE_DB_TESTS: "true"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
        run: |
          # Fail-closed enforcement: required security test file must exist
          if [ ! -f "tests/security/listings-rls.test.ts" ]; then
            echo "::error::Required security test file tests/security/listings-rls.test.ts not found. Aborting."
            exit 1
          fi
          pnpm vitest run tests/security/listings-rls.test.ts

      - name: Run MOD-03A Automatic Moderation Integration Tests
        run: |
          # Detect whether MOD-03A migrations and features are present on this branch
          MIGRATION_38="supabase/migrations/20261011000038_create_moderation_queue_and_results.sql"
          MIGRATION_39="supabase/migrations/20261011000039_moderation_dispatch_and_killswitch.sql"
          INTEGRATION_TEST="src/__tests__/moderation-integration.test.ts"

          if [ -f "$MIGRATION_38" ] || [ -f "$MIGRATION_39" ]; then
            echo "MOD-03A migrations detected. Requiring integration test suite $INTEGRATION_TEST..."
            if [ ! -f "$INTEGRATION_TEST" ]; then
              echo "::error::MOD-03A migrations are present but required integration test $INTEGRATION_TEST is missing. Aborting."
              exit 1
            fi

            # Parse dynamic connection configuration from local Supabase CLI
            STATUS_JSON=$(supabase status -o json)
            DB_URL=$(echo "$STATUS_JSON" | jq -r '.DB_URL // empty')
            REST_URL=$(echo "$STATUS_JSON" | jq -r '.API_URL // empty')
            ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')
            SERVICE_ROLE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // empty')

            if [ -z "$DB_URL" ] || [ -z "$REST_URL" ]; then
              echo "::error::Failed to read local Supabase connection configuration from status output."
              exit 1
            fi

            # Extract host and port safely
            DB_PORT=$(echo "$DB_URL" | sed -n 's/.*:\([0-9]*\)\/.*/\1/p')
            DB_HOST="127.0.0.1"

            # Generate unique test run identity for this CI run
            TASK_RUN_ID="ci-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
            echo "Initializing test run identity: $TASK_RUN_ID on port $DB_PORT"

            # Create disposable validation marker strictly in local PostgreSQL
            supabase db query 'CREATE SCHEMA IF NOT EXISTS test_validation_meta;'
            supabase db query 'CREATE TABLE IF NOT EXISTS test_validation_meta.run_identity (run_id text PRIMARY KEY, task text NOT NULL);'
            supabase db query "INSERT INTO test_validation_meta.run_identity (run_id, task) VALUES ('$TASK_RUN_ID', 'MOD-03A') ON CONFLICT (run_id) DO UPDATE SET task = EXCLUDED.task;"

            # Execute all MOD-03A integration tests with opt-in enabled and capture machine-readable JSON results
            REPORT_FILE="mod03a-integration-report.json"
            MOD03A_RUN_LOCAL_DB_TESTS=true \
            MOD03A_TASK_RUN_ID="$TASK_RUN_ID" \
            MOD03A_DB_HOST="$DB_HOST" \
            MOD03A_DB_PORT="$DB_PORT" \
            MOD03A_DB_NAME="postgres" \
            NEXT_PUBLIC_SUPABASE_URL="$REST_URL" \
            NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
            SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            pnpm vitest run "$INTEGRATION_TEST" --pool=threads --reporter=default --reporter=json --outputFile="$REPORT_FILE"

            # Machine-readable Zero-Skip Enforcement
            if [ ! -f "$REPORT_FILE" ]; then
              echo "::error::Integration test report '$REPORT_FILE' was not generated. Aborting."
              exit 1
            fi

            TOTAL=$(jq -r '.numTotalTests // empty' "$REPORT_FILE")
            PASSED=$(jq -r '.numPassedTests // empty' "$REPORT_FILE")
            FAILED=$(jq -r '.numFailedTests // empty' "$REPORT_FILE")
            PENDING=$(jq -r '.numPendingTests // empty' "$REPORT_FILE")
            TODO=$(jq -r '.numTodoTests // empty' "$REPORT_FILE")
            SUCCESS=$(jq -r '.success // empty' "$REPORT_FILE")

            echo "=== MOD-03A Integration Test Result Audit ==="
            echo "Total: $TOTAL | Passed: $PASSED | Failed: $FAILED | Skipped/Pending: $PENDING | Todo: $TODO | Success: $SUCCESS"

            if [ "$SUCCESS" != "true" ]; then
              echo "::error::Vitest reported suite failure (success: $SUCCESS)."
              exit 1
            fi

            if [ "$TOTAL" -lt 13 ]; then
              echo "::error::Expected at least 13 integration tests to execute (Safety + Cases A through L), but found only $TOTAL."
              exit 1
            fi

            if [ "$FAILED" -ne 0 ]; then
              echo "::error::One or more integration tests failed ($FAILED failed)."
              exit 1
            fi

            if [ "$PENDING" -ne 0 ] || [ "$TODO" -ne 0 ]; then
              echo "::error::Zero-skip policy violated! Detected skipped/pending: $PENDING, todo: $TODO. All required integration scenarios must execute."
              exit 1
            fi

            echo "✓ Zero-skip verification PASSED: All $PASSED required MOD-03A scenarios executed and passed with 0 skips."
          else
            echo "MOD-03A migrations not detected on this branch; skipping MOD-03A integration suite."
          fi
