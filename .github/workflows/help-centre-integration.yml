name: Help Centre Integration Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  help-centre-validation:
    name: Lint, Typecheck, Regression, Build and Browser Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sbp_local_anon_key_for_testing
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder_not_real
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Mint short-lived Backend Contents-read token
        id: backend-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # pinned v2
        with:
          app-id: ${{ vars.FAIRSWAP_BACKEND_CI_APP_ID }}
          private-key: ${{ secrets.FAIRSWAP_BACKEND_CI_APP_PRIVATE_KEY }}
          owner: vivek2310sharma
          repositories: FairSwap-Backend
          permission-contents: read

      - name: Checkout immutable private Backend source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4.2.2
        with:
          repository: vivek2310sharma/FairSwap-Backend
          ref: 2f26f839c3fa0ae690cf5c3795a983d62e1b6c47
          token: ${{ steps.backend-token.outputs.token }}
          path: .fairswap-backend-ci-source
          persist-credentials: false

      - name: Validate and materialize Backend SQL only for disposable CI
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/materialize-backend.mjs "$GITHUB_WORKSPACE/.fairswap-backend-ci-source"
          rm -rf -- "$GITHUB_WORKSPACE/.fairswap-backend-ci-source"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Disposable Local Supabase
        run: supabase start -x studio,analytics,logflare,supavisor

      - name: Export Supabase keys to ENV before build
        run: |
          STATUS_JSON=$(supabase status -o json)
          echo "SUPABASE_SECRET_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY // empty')" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY // empty')" >> $GITHUB_ENV

      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Help Centre unit and compatibility regression tests
        run: |
          pnpm exec vitest run \
            src/__tests__/header.test.tsx \
            src/__tests__/footer.test.tsx \
            src/__tests__/account-navigation.test.tsx \
            src/__tests__/grievance-crosslinks.test.tsx \
            src/__tests__/help-centre-redirect.test.ts \
            src/__tests__/public-help-access.test.tsx \
            tests/unit/sitemap.test.ts
      - name: Production build with disposable placeholder configuration
        run: pnpm build
      - name: Install Chromium for desktop and mobile checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Public Help Centre browser regressions
        run: pnpm exec playwright test e2e/help-centre.spec.ts
      - name: Run Homepage Playwright Regression Tests
        run: pnpm exec playwright test e2e/homepage-performance.spec.ts

      - name: Run Navigation Regression Tests
        env:
          ALLOW_LOCAL_TEST_MUTATIONS: "true"
        run: pnpm exec playwright test e2e/navigation.spec.ts
